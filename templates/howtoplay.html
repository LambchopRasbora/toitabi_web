<!doctype html>
<html lang="ja" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title>トイタビ – 遊び方</title>
  <!--CSSファイルを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="../../static/css/howtoplay.css" th:href="@{/css/howtoplay.css}">
</head>
<body>
  <script type="module" th:inline="javascript">
    import { menuInitialize } from /*[[@{/js/common/menu.js}]]*/ '../../static/js/common/menu.js';

    document.addEventListener('DOMContentLoaded', () => {
      menuInitialize();
    });
  </script>
  <!--CSSレイアウト制御用の画面全体を囲うコンテナ-->
  <div class="screen">
    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('遊び方')}"></div>

    <!-- Main Content -->
    <main class ="content">
        <h1>遊び方</h1>
        <h3>1, エリアを選ぼう</h3>
        <img class="description-picture" src="../../static/asset/images/howtoplay/areachoice.png" th:src="@{/asset/images/howtoplay/areachoice.png}"/>
        <p>遊びたいエリアを選ぼう!エリアがない場合は自分で作ることも可能!!</p>
        <h3>2, トイスポットを探そう</h3>
        <img class="description-picture" src="../../static/asset/images/howtoplay/quiz.png" th:src="@{/asset/images/howtoplay/quiz.png}"/>
        <p>4枚の写真と文章をもとにその場所を探して歩き回ろう!</p>
        <img class="description-picture" src="../../static/asset/images/howtoplay/hint.png" th:src="@{/asset/images/howtoplay/hint.png}"/>
        <p>わからない場合はヒントを取得することも可能!!</P>
        <h3>3, キャラクターゲット</h3>
        <img class="description-picture" src="../../static/asset/images/howtoplay/charaget.png" th:src="@{/asset/images/howtoplay/charaget.png}"/>
        <p>トイスポットにたどり着き「トイスポットを確定」ボタンを押すとキャラクターをゲット</p>
        <img class="description-picture" src="../../static/asset/images/howtoplay/score.png" th:src="@{/asset/images/howtoplay/score.png}">
        <p>答え合わせ画面ではスポットの情報と距離、得点を確認</p>

        <h1>投稿方法</h1>
        <h3>1,ホーム画面から「トイスポット投稿」をタップ</h3>
        <img class="description-picture" src="../../static/asset/images/howtoplay/home.png" th:src="@{/asset/images/howtoplay/home.png}"/>
        <h3>2,写真1~4枚、説明文、投稿者、タグを設定してトイスポットを投稿!</h3>
        <img class="description-picture" src="../../static/asset/images/howtoplay/spotpost.png" th:src="@{/asset/images/howtoplay/spotpost.png}"/>
        <img class="description-picture" src="../../static/asset/images/howtoplay/spotindex.png" th:src="@{/asset/images/howtoplay/spotindex.png}"/>
        <p>投稿したスポットはトイスポット一覧から見られます</p>
    </main>
    
    <!-- Footer -->
    <footer class="app-footer">
      <!-- Bottom actions -->
      <div class="bottom-actions">
        <!--設定画面へ遷移するボタン-->
        <button class="action-btn menu-btn" type="button" onclick= "location.href='/'" >
          <!--ボタンのラベル-->
          <div class ="caption">ホームへ戻る</div>
          <!--メニューアイコン-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_home.png" th:src="@{asset/images/icon/icon_home.png}"/>
        </button>

        <!--投稿画面へ遷移-->
        <button class="action-btn" type="button" onclick= "location.href='/spotpost/capture'" >
          <!--ボタンのラベル-->
          <div class="caption">トイスポットを投稿</div>
          <!--投稿用アイコン-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
        </button>
      </div> 
    </footer>
  </div>
</body>
</html>
