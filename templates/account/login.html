<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ログイン</title>

    <link rel="stylesheet" href="/static/css/common.css" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="/static/css/account/login.css" th:href="@{/css/account/login.css}">
</head>
<body>
    <div class="screen">
        <!-- Header-->
    <div th:replace="~{common/layout :: header-nav('ログイン')}"></div>

    <main class="login-main">
        <h1 class="login-title">ログイン</h1>
        <form th:action="@{/login}" method="post" class="login-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <h3 for="identifier">メールアドレス</h3>
                <input id="identifier" type="email" name="username" placeholder="メールアドレス" required autofocus>
            </div>

            <div class="form-group">
                <h3 for="password">パスワード</h3>
                <input id="password" type="password" name="password" placeholder="パスワード" required>
            </div>

            <div class="form-group">
                <label><input type="checkbox" name="remember-me"> 次回から自動でログイン</label>
            </div>

            <button type="submit" class="btn-login"><h3>ログイン</h3></button>
        </form>
        <div class = "signup-link">
            <h3>アカウントがない場合は<br> 
                <a href="/signup">アカウント登録</a>
            </h3>
        </div>
    </main>
    </div>
    <script type="module" src="../../static/js/account/login.js" th:src="@{/js/account/login.js}"></script>
    </script>
</body>
</html>
