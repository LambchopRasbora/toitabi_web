<!DOCTYPE html>
<html lang="ja">
    <head>
            <!-- CSRF -->
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>アカウント有効化完了</title>
        <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">

    </head>
    <body>
    <div class="screen">
      <div th:replace="~{common/layout :: header-nav('アカウント有効化完了')}"></div>
      <main class ="content">
        <div class="container">
          <!-- キャラクター吹き出し（左向き） -->
          <section class="ch-stack">
            <div class="ch-balloon">
              <p class="ch-text">
                アカウントの有効化が正常に完了しました。
                ログインしてサービスを利用開始してください。
              </p>
              <a href="/login" class="btn-primary">ログインページへ</a>
            </div>
            <img class="ch-avatar"
              src="../../static/asset/images/character/character_01.png"
              th:src="@{/asset/images/character/character_01.png}" alt="トイタビキャラクター"/>
          </section>

        </div>
      </main>   
    </div>
    <script type="module" src="../../static/js/account/signup.js" th:src="@{/js/account/signup.js}"></script>
    </body>
</html>
