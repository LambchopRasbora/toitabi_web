<!doctype html>
<html lang="ja">
<head>

  <th:block th:replace="~{common/layout :: head-common}"></th:block>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>トイタビ – トイスポット投稿</title>
  <meta name="description" content="街の隠れた名所へ出かけるお散歩クイズサイト クイズを投稿してみよう!!">
  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">

  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="../../static/css/capture.css" th:href="@{/css/capture.css}">

  <script type="module" src="../../static/js/capture/capture.js" th:src="@{/js/capture/capture.js}"></script>
</head>
<body>
  <div class="screen">
    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('トイスポット投稿')}"></div>

    <main class ="content">
      <div class="container">
        <button class="camera-btn" id="shootBtn" type="button" aria-label="カメラを起動">
          <p>画像を選択する<br>(人の顔などのプライバシーに注意してください)</p>
          <img src="../../static/asset/images/cameraicon.png" th:src="@{/asset/images/cameraicon.png}" alt="" class="camera-icon">
        </button>
        
        <!-- 実際の入力要素（4枚まで） -->
        <input id="fileInput" type="file" accept="image/*" multiple hidden />

        <!-- フォームエリア-->
        <section id="formArea" class="form-area is-hidden">
          <!-- プレビューエリア -->
          <div class="preview-grid" id="previewGrid"></div>

          <button type="button" id="retakeBtn" class="ghost-btn field">撮り直す</button>

          <div class="form-fields">
            <div class="field c-card">
              <span class="label">投稿者</span>
              <span class="username" sec:authorize="isAuthenticated()" th:text="${#authentication.principal.user.username}"></span>
              <!--未ログイン時-->
              <button class="user-info-btn capsule-btn" sec:authorize="isAnonymous()"onclick="location.href='/login'">
                <span class="username">ログイン</span>
              </button>
            </div>

            <div class="field c-card">
              <span class="label">説明文</span>
              <textarea id="caption" rows="3" placeholder="どんな場所か、ひとこと説明を書いてください（お気に入りの理由・あなたのエピソードなど、任意）"></textarea>
            </div>

            <!--位置情報を添付する-->
            <div class="field c-card">
              <div id="mapFrame" class="map" src="" title="地図"></div>
              <button type="button" id="locBtn" class="sec-btn">現在地に設定</button>
              <span id="locStatus" class="muted">位置情報は未取得</span>
              <span>地図上を長押しでも位置を設定できます</span>
            </div>

            <div class="field c-card">
              <span class="label">タグ</span>
              <div class ="grid tag-area">
              </div>
              <template id="tag-template">
                <button class="tags" data-active="false" data-tagName="">
                  <span class="tag-label">グルメ</span>
                </button>
              </template>

              <div class ="tag-input-container">
                <input class="tag-input-field" type="text" id="tagInput" placeholder="タグを追加" />
                <button class="tag-add-btn" id="addTagBtn" type="button">新しいタグを追加</button>
              </div>
            </div>

            <div class = "c-card">
              <input type="checkbox" id="isHiddenCheckbox"/>
              <label for="isHiddenCheckbox">このスポットを非公開にする</label>
            </div>

            <div class="actions">
              
              <button type="button" id="submitBtn" class="icon-btn" disabled>
                <p>投稿する!!</p>
                <img src="../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}" alt="投稿" class="btn-icon">
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <!-- Bottom actions -->
    <footer class="app-footer">
      <div class="bottom-actions">
        <button class="action-btn menu-btn"  type="button" >
          <div class ="caption">メニュー </div>
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_menu.png" th:src="@{/asset/images/icon/icon_menu.png}"/>
        </button>
        <button class="action-btn" type="button" onclick="location.href='/'">
          <div class="caption">ホームに戻る</div>
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_home.png" th:src="@{/asset/images/icon/icon_home.png}"/>
        </button>
      </div>
    </footer>
    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
    </div>
  </div>
</body>
</html>
