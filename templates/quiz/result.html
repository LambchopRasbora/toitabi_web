<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <!--CSRFトークン本体をHTMLに埋め込む-->
  <meta name="_csrf" th:content="${_csrf.token}">
  <!--CSRFトークンを送信するヘッダー名-->
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <!--CSRFトークンを送信する ヘッダー名-->
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">

  <!--画面幅を端末幅に合わせ、初期倍率1倍にする-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リザルト画面</title>
  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">
  <!-- Leaflet -->
  <!--Leafletの 地図表示用CSS をCDNから読み込む-->
  <!--ファイル改ざん検知用のハッシュ（SRI）-->
  <!--CDN利用時のCORS設定-->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!--Leafletの JavaScript本体 を読み込む-->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- LeafletLocate CSS / JS（CDN）-->
  <!--現在地ボタン用CSS-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.css">
  <!--現在地取得用JS-->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.js"></script>

  <!--全画面共通CSS-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel ="stylesheet" href="../../static/asset/css/common/spotcomponent.css" th:href="@{/css/common/spotcomponent.css}">
  <!--リザルト画面専用CSS-->
  <link rel="stylesheet" href="../../static/css/result.css" th:href="@{/css/result.css}">

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <!--Thymeleafの値をJS内に埋め込む-->
  <script th:inline="javascript">
   let response =/*[[${response}]]*/
  </script>

  <!--画面全体のレイアウト用ラッパー-->
  <div class="screen">
    <!-- 固定ヘッダー -->
    <div th:replace="~{common/layout :: header-nav('ログイン')}"></div>

    <!-- スクロール可能メイン -->
    <main class="content" id="scrollArea">
    <div class = "container">

    <section class="metrics">
      <!--スコア表示カード-->
      <div class="scoreCard" aria-label="スコア">
        <!-- 上段：スコア -->
        <div class="score-main">
          <!--ラベル表示-->
          <div class="label">最終スコア</div>
          <!--スコア値エリア-->
          <div class="value">
            <span id="scoreValue">--</span>
            <span class="unit">点</span>
          </div>
        </div>

        <!-- 下段：時間・距離 -->
        <div class="score-sub">
          <!--合計時間ブロック-->
          <div class="score-sub-item">
            <span class="score-sub-label">合計時間</span>
            <span id="timeValue">--</span>
            <span class="score-sub-unit"></span>
          </div>
          <!--合計距離ブロック-->
          <div class="score-sub-item">
            <span class="score-sub-label">合計距離</span>
            <span id="distValue">--</span>
            <span class="score-sub-unit"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ② マップ（3スポットのピン & ポップアップ） -->
    <div class="result-map-wrap">
      <!--Leafletが描画する地図DOM-->
      <div id="result-map"></div>

    </div>

    <section id="spot-cards" class="c-card">
      <div v-for="spot in spots" :key="spot.spotId">
        <spot-review-card
          :description="spot.description||'説明なし'"
          :author="spot.author||'問人知らず'"
          :tags="spot.tags||'[]'"
          :image="spot.images[0]||'/asset/images/default/NoImage.jpg'"
        >
        </spot-review-card>
      </div>
    </section>

    <section id="chara-area" class="c-card">
      
    </section>

    <!--  画面全体オーバーレイ（半透明白） -->
    <div id="overlay" class="overlay hidden"></div>

    <!--  画面全体のポップアップ -->
    <div id="spot-popup" class="spot-popup hidden">
      <!--ポップアップの中身-->
      <div class="spot-popup-inner">
        <!--スポット名（JSで差し替え）-->
        <div class="spot-popup-title" id="popup-title">スポット名</div>
        <!--写真表示領域-->
        <div class="spot-popup-photo-wrap">
          <img id="popup-photo" src="" alt="">
        </div>
      </div>
    </div>

    </div>
    </main>

    <div id="footer">
      <toitabi-footer :ratio="'1fr 2fr'"
        :leftcontents="leftContents"
        :rightcontents="rightContents">
      </toitabi-footer> 
    </div>
    
  </div>
  
  <!--リザルト画面専用ロジック）-->
  <script type="module" src="../../static/js/quiz/result.js" th:src="@{/js/quiz/result.js}"></script>
  
</body>
</html>
