<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">
  
  <title>トイタビ – プレイ中</title>
  <!--全ページ共通のCSS-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <!--ローディング画面用CSS-->
  <link rel="stylesheet" href="../../static/css/loading.css" th:href="@{/css/loading.css}">

  <!--LeafletのCDNに 事前接続 して読み込みを高速化-->
  <link rel="preconnect" href="https://unpkg.com" />
  <!--プレイ中（問題画面）専用のCSS-->
  <link rel="stylesheet" href="../../static/css/game/question.css" th:href="@{/css/game/question.css}">
  <!-- Leaflet CSS / JS（CDN）, 地図表示用CSS-->
  <link  rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!--LeafletのJavaScript本体-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- LeafletLocate CSS / JS（CDN）, 現在地ボタンのCSS-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.css">
  <!--現在地取得用JS-->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.js"></script>
  
  <script src="https://unpkg.com/leaflet-semicircle"></script>
</head>

<!--ページ本体開始 背景色をCSS変数 --ink に設定-->
<body style="background-color:var(--ink);">
  <!--画面全体のレイアウト管理用-->
  <div class="screen">
    <!--Thymeleafの値をJS内で使えるようにする-->
    <!--サーバーから渡された response をJS変数に代入-->
    <script th:inline="javascript">
      let response =/*[[${response}]]*/
    </script> 

    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('トイスポットを探せ')}"></div>

    <!-- 中央スクロール領域 -->
    <main class="content" id="scrollArea">
      <!-- 写真4枚 -->
      <section id="gallerySection" class="gallery c-card">
        <!--メイン写真-->
        <div class="main-photo">
          <!--選択された写真を表示（JSで差し替え）-->
          <img id="mainPhoto" src="" alt="spot main">
        </div>

        <!--サムネイル一覧-->
        <div class="thumbs" id="thumbs">
          <button class="thumb is-active" data-src="" th:data-src="@{\asset\images\default\NoImage.jpg}">
            <img src="..\..\static\asset\images\default\NoImage.jpg" th:src="@{\asset\images\default\NoImage.jpg}" alt="">
          </button>
          <button class="thumb" data-src="" th:data-src="@{\asset\images\default\NoImage.jpg}">
            <img src="..\..\static\asset\images\default\NoImage.jpg" th:src="@{\asset\images\default\NoImage.jpg}" alt="">
          </button>
          <button class="thumb" data-src="" th:data-src="@{\asset\images\default\NoImage.jpg}">
            <img src="..\..\static\asset\images\default\NoImage.jpg" th:src="@{\asset\images\default\NoImage.jpg}" alt="">
          </button>
          <button class="thumb" data-src="" th:data-src="@{\asset\images\default\NoImage.jpg}">
            <img src="..\..\static\asset\images\default\NoImage.jpg" th:src="@{\asset\images\default\NoImage.jpg}" alt="">
          </button>
        </div>
      </section>
      <!--ヒント-->
      <section id ="discription-section" class="hint-section c-card">
        <!-- 必要なら下に説明や距離表示など -->
        <div>
          <p id="author"> </p> 
        </div>
        <div>
          <!--スポット説明文（JSで挿入）-->
          <p id="description"></p>
        </div>
        <div>
          <!--残り距離表示（JSで更新）-->
          <p id="distance">あと100m</p>
        </div>
        <div>
          <p id="tags">タグ</p>
        </div>
      </section>
      <section id="hint-section" class="hint-section c-card">
        <!--ヒント表示エリア-->
        <button id="hint-btn" class="capsule-btn">
          <p>ヒントの取得</p>
        </button>
      </section>
      <!-- 現在地マップ -->
      <section id="mapSection" class="map-wrap c-card">
        <!--Leafletが地図を描画するDOM-->
        <div id="map"></div>
        <!--注意書き-->
        <div class="map-caption">現在地を表示中（位置情報の許可が必要です）</div>
      </section>
      <section id="answer-user" class ="c-card">
        <span class="label">解答中のユーザー</span>
        <span class="username" sec:authorize="isAuthenticated()" th:text="${#authentication.principal.user.username}"></span>
        <!--未ログイン時-->
        <button class="user-info-btn capsule-btn" sec:authorize="isAnonymous()"onclick="location.href='/login'">
          <span class="username">ログイン</span>
        </button>
      </section>
    </main>

    <!--footer-->
    <footer class="app-footer">
      <!-- Bottom actions -->
      <div class="bottom-actions">
        <!--メニュー表示ボタン-->
        <button class="action-btn menu-btn" type="button" >
          <!--text-->
          <div class ="caption">メニュー</div>
          <!--icon-->
          <img class = "icon-img" src = "../../static/asset/images/menulogo.png" th:src="@{/asset/images/menulogo.png}"/>
        </button>

        <!--スポット確定ボタン-->
        <button class="action-btn post-btn" type="button">
          <!--text-->
          <div class="caption">トイスポット確定</div>
          <!--icon-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_guess.png" th:src="@{/asset/images/icon/icon_guess.png}"/>
        </button>
      </div>
    </footer>
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loadingOverlay">
    <!--回転アニメーション-->
    <div class="spinner"></div>
  </div>

  <!-- Question制御用スクリプト -->
  <script type="module" src="../../static/js/quiz/question.js" th:src="@{/js/quiz/question.js}"></script>
</body>
</html>
