<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <!--CSRFトークン本体を metaタグ として埋め込む-->
  <meta name="_csrf" th:content="${_csrf.token}">
  <!--CSRFトークンを送信するときに使う HTTPヘッダー名 を埋め込む-->
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <!--CSRFトークンを送信するときの パラメータ名 を埋め込む-->
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <!--画面幅を端末の幅に合わせ、初期倍率を1倍に設定-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>ゴール画面</title>
  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">

  <!--Leafletの CSS（地図の見た目） をCDNから読み込む-->
  <!--ファイルが改ざんされていないかを検証するためのハッシュ-->
  <!--CDN利用時の CORS設定（SRIを使うために必要）-->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!--共通CSSを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <!--ゴール画面専用のCSSを読み込む-->
  <link rel="stylesheet" href="../../static/css/game/goal.css" th:href="@{/css/game/goal.css}">
  <!--Leafletの JavaScript本体 をCDNから読み込む-->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- LeafletLocate CSS / JS（CDN）, Leafletの 現在地ボタン（LocateControl） 用CSSを読み込む-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.css">
  <!--現在地取得・追跡を行う LeafletプラグインのJS を読み込む-->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.js"></script>
</head>

<body>
  <!--Thymeleaf の値を JavaScript内に直接埋め込める ようにする設定-->
  <!--サーバー側の response オブジェクトをJavaScriptの response 変数として受け取る-->
  <script th:inline="javascript">
    let response =/*[[${response}]]*/; 
    
    
    //let response ={"session_id":"732f3717-0a13-4dab-bb72-4ec5543d9fad","answer_id":3,"answerDto":{"answerLat":34.995287302385655,"answerLng":135.7583492775325,"distance_meter":27,"point":91,"skip":false},"obtainedChara":{"charaId":7,"name":"\u4FE1\u53F7\u6A5F\u30D6\u30E9\u30B6\u30FC\u30BA\uFF08\u9752\uFF09","description":"\u9032\u3093\u3067\u3082\u3044\u3044\u3088\u3068\u5E83\u3044\u5EA6\u91CF\u3067\u901A\u884C\u4EBA\u3092\u901A\u3059\u4E09\u5144\u5F1F\u3067\u4E00\u756A\u306E\u4EBA\u6C17\u8005","lowImageUri":"https:\/\/chara.toitabi.net\/256-07.png","highImageUri":"https:\/\/chara.toitabi.net\/1080-07.png"},"spotDto":{"spotId":28,"author":"\u554F\u4EBA\u77E5\u3089\u305A","authorId":0,"images":["https:\/\/localtestspot.toitabi.net\/134a2125-9d20.jpg","https:\/\/localtestspot.toitabi.net\/640ad15d-715c.jpg","https:\/\/localtestspot.toitabi.net\/cbb4df7e-9814.jpg","https:\/\/localtestspot.toitabi.net\/41ef996e-a006.jpg"],"tags":[],"description":"","latitude":34.995303516318394,"longitude":135.75805033980902},"getCharaDto":null,"finish":true,"onlyView":true}; 
    
   </script>
  <!--外部 JavaScript の読み込み-->
  <!--回答データの処理や結果表示用JS-->
  <script type="module" src="../../static/js/quiz/answer.js" th:src="@{/js/quiz/answer.js}"></script>
  
  <!--画面全体を包むコンテナ（レイアウト管理用）-->
  <div class="screen">
    <!-- 固定ヘッダー -->
    <div th:replace="~{common/layout :: header-nav('結果!!')}"></div>

    <!--スクロール可能なメイン表示領域-->
    <main class="content" id="scrollArea">
      <!--数値情報（スコア等）をまとめるセクション-->
      <section class="metrics">
        <!--スコア表示-->
        <div class="scoreCard" aria-label="スコア">
          <!--上段-->
          <!--スコアのメイン表示部分-->
          <div class="score-main">
            <!--ラベル表示-->
            <div class="label">スコア</div>
            <!--スコア値表示用-->
            <div class="value">
              <!--JavaScriptで 点数が書き換えられる場所-->
              <span id="scoreValue">--</span>
              <!--単位表示-->
              <span class="unit">点</span>
            </div>
          </div>

          <!--下段-->
          <!--補助情報の表示領域-->
          <div class="score-sub">
            <!--時間表示ブロック-->
            <div class="score-sub-item">
              <!--「時間」ラベル-->
              <span class="score-sub-label">時間</span>
              <!--プレイ時間がJSで入る-->
              <span id="timeValue">--</span>
              <!--単位用（分など）-->
              <span class="score-sub-unit"></span>
            </div>
            <!--距離表示ブロック-->
            <div class="score-sub-item">
              <!--「距離」ラベル-->
              <span class="score-sub-label">距離</span>
              <!--移動距離がJSで入る-->
              <span id="distValue">--</span>
              <!--単位用（m / km）-->
              <span class="score-sub-unit"></span>
            </div>
          </div>
        </div>
      </section>

      <!--地図表示用セクション-->
      <section class="mapCard c-card">
        <!--Leafletが地図を描画する DOM要素-->
        <div id="map" role="application" aria-label="結果マップ"></div>
      </section>

      <section id ="spot-info-section">
        <div class="content-field image-field c-card">
          <img class="main-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}"/>
          <div class="preview-grid">
            <img class="preview-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}"/>
            <img class="preview-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}"/>
            <img class="preview-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}"/>
            <img class="preview-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}"/>
          </div>
        </div>

        <div class="content-field hint-field c-card">
          <h3>説明文</h3>
          <span class="description">説明文が表示されます。</span>
          <h3>タグ</h3>
          <div class="tag-field"></div>
        </div>
      </section>
    </main>

    <!-- 固定フッター -->
    <footer class="app-footer">
      <!--ボタンを横並びにする領域-->
      <div class="bottom-actions" style="grid-template-columns:1fr 2fr;">
        <div class ="footer-button-container">
          <button class="action-btn sns-btn c-card" type="button" onclick=""> 
            <!--ボタンのテキスト-->
            <div class ="caption">SNSシェア</div>
            <!--次へ進むアイコン-->
            <img class = "icon-img" src = "../../static/asset/images/icon/icon_share.png" th:src="@{/asset/images/icon/icon_share.png}"/>
          </button>
          <button class="action-btn home-btn c-card" type="button" onclick="location.href='/'"> 
            <!--ボタンのテキスト-->
            <div class ="caption">ホームに戻る</div>
            <!--次へ進むアイコン-->
            <img class = "icon-img" src = "../../static/asset/images/icon/icon_home.png" th:src="@{/asset/images/icon/icon_home.png}"/>
          </button>
        </div>
        <!--ホームに戻るボタン-->
        <div class ="footer-button-container">
          <button class="action-btn next-btn  c-card" type="button" onclick=""> 
            <!--ボタンのテキスト-->
            <div class="caption">次のスポットへ</div>
            <!--ホームアイコン-->
            <img class = "icon-img" src = "../../static/asset/images/icon/icon_visit.png" th:src="@{/asset/images/icon/icon_visit.png}"/>
          </button>
        </div>
      </div>
    </footer>
  </div>
  
  <div class="screen  hidden">
    <!--キャラクターゲット時のコンテンツ-->
    <div id="get-overlay" class ="overlay character-overlay-area">
      <div class ="character-title-container">
        <h1 class="character-title">キャラクターゲット!!</h1>
      </div>
      <div class ="character-area-container c-card">
        <img class ="character-back" src="../../static/asset/images/back/backstar.png" th:src="@{/asset/images/back/backstar.png}">
        <img class ="character-img" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}" alt="キャラクター画像">
      </div>
      <div class = "message-area-container c-card">
        <h2 class="message-title">キャラクターの名前</h2>
        <p class="message-text">キャラクターの説明</p>
      </div>
      <div class ="button-area-container">
        <button class="get-close-btn capsule-btn">
          <p>閉じる</p>
        </button>
      </div>
    </div>

    <!--キャラクターゲット失敗時のコンテンツ-->
    <div id="false-overlay" class ="overlay character-overlay-area">
      <div class ="character-title-container">
        <h1 class="character-title">キャラクターゲット失敗</h1>
      </div>
      <div class ="character-area-container c-card">
        <img class ="false-img" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}" alt="キャラクター画像">
      </div>
      <div class = "message-area-container c-card">
        <h2 class="message-title">キャラクターゲット失敗</h2>
        <p class="message-text">キャラクターゲットには80点が必要です</p>
      </div>
      <div class ="button-area-container">
        <button class="get-close-btn capsule-btn">
          <p>閉じる</p>
        </button>
      </div>
    </div>

  </div>
</body>
</html>
