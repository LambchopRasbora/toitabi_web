<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--CSRFトークン本体を metaタグ として埋め込む-->
  <meta name="_csrf" th:content="${_csrf.token}">
  <!--CSRFトークンを送信するときに使う HTTPヘッダー名 を埋め込む-->
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <!--CSRFトークンを送信するときの パラメータ名 を埋め込む-->
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>テーマ投稿</title>
    <link rel="stylesheet" href="/static/css/admin/common.css" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" href="/static/css/admin/themepost.css" th:href="@{/css/admin/themepost.css}">
</head>
<body>
     <!-- Areas data embedded as JSON -->
    <script id="areas-data" type="application/json" th:inline="javascript">
       let areas= /*[[${areas}]]*/;
    </script>
    <div id="post-form" class="container">
        <h1>テーマ投稿</h1>
        
        <form @submit.prevent="submit" enctype="multipart/form-data">
            <!-- Area ID -->
            <div class="form-group">
                <label for="areaId">エリアID <span class="required">*</span></label>
                <select id="areaId" v-model="formData.areaId" required>
                    <option value="">選択してください</option>
                    <option th:each="area : ${areas}" th:value="${area.areaId}" th:text="${area.areaname}">Area Option</option>
                </select>
            </div>
            <!-- Name -->
            <div class="form-group">
                <label for="name">テーマ名 <span class="required">*</span></label>
                <input type="text" id="name" v-model="formData.name" required/>
            </div>
            
            <!-- Description -->
            <div class="form-group">
                <label for="description">説明</label>
                <textarea id="description" v-model="formData.description"></textarea>
            </div>
            
            <!-- Thumbnail File -->
            <div class="form-group">
                <label for="thumbnailfile">サムネイル画像</label>
                <input type="file" id="thumbnailfile" @change="handleFileUpload" accept="image/*"/>
            </div>
            
            <!-- Enabled -->
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="enabled" v-model="formData.enabled"/>
                    <span>有効にする</span>
                </label>
            </div>
            
            <!-- Hidden -->
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="hidden" v-model="formData.hidden"/>
                    <span>非表示にする</span>
                </label>
            </div>
            
            <!-- Rules Section -->
            <div class="form-group">
                <label>ルール</label>
                <div class="rule-section" id="rulesContainer">
                   <theme-rule-editor
                    v-for="(rule,index) in rules"
                    :key="index"
                    v-model="rules[index]"
                    :index="index"
                    @remove="removeRuleItem(index)">
                    </theme-rule-editor>
                </div>
                <button type="button" class="add-rule-btn" @click="addRuleItem">ルールを追加</button>
            </div>
            
            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit">投稿</button>
            </div>
            
        </form>
    </div>
    
   
    
    <script type="module" src="/static/js/admin/themepost.js" th:src="@{/js/admin/themepost.js}"></script>
</body>
</html>
