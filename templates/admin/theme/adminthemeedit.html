<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <!--CSRFトークン本体を metaタグ として埋め込む-->
  <meta name="_csrf" th:content="${_csrf.token}">
  <!--CSRFトークンを送信するときに使う HTTPヘッダー名 を埋め込む-->
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <!--CSRFトークンを送信するときの パラメータ名 を埋め込む-->
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Edit Theme</title>
    <link rel="stylesheet" href="/static/css/admin/common.css" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" href="/static/css/admin/themepost.css" th:href="@{/css/admin/themepost.css}">
</head>
<body>
<script th:inline="javascript">
    
    window.__THEME_DATA__ = /*[[${theme}]]*/ {};
    window.__TAG_DATA__ = /*[[${tags}]]*/ {};

</script>
<div class="container">
    <h1>Edit Theme</h1>

    <div id="edit-form">
        <div th:if="${theme == null}">Theme not found.</div>

        <div th:if="${theme != null}">
            <form  id="themeForm"  @submit.prevent="submitEdit" enctype="multipart/form-data">
                <!-- Hidden ID for submission -->
                <div class="form-group">
                    <label for="id">themeId</label>
                    <span type="text" id="id" th:field="${theme.themeId}">{{form.themeId}}</span>
                </div>

                <div class="form-group">
                    <label for="areaId">Area ID</label>
                    <span type="number" id="areaId" th:field="${theme.areaId}" >{{form.areaId}}</span>
                </div>

                <div class="form-group">
                    <label for="name">Theme Name *</label>
                    <input type="text" id="name" v-model="form.name" required />
                </div>

                <div class="form-group">
                    <label for="desc">Description</label>
                    <textarea id="desc" v-model="form.description"></textarea>
                </div>

                <div class="form-group">
                    <label>Thumbnail画像</label>
                    <span>サムネイル画像変更ならばチェック</span>
                    <input type="checkbox" id="thumbCheckbox" v-model="form.thumbnailChanged" />
                    <img :src="previewThumbnailURL" alt="Thumbnail" class="thumbnail-preview" />
                    <input type="file" id="thumbnailfile" v-if="form.thumbnailChanged" @change="handleFileUpload" accept="image/*" >
                </div>

                <div class="form-group">
                    <label for="enabled">Enabled</label>
                    <input type="checkbox" id="enabled" v-model="form.enabled" />
                </div>

                <div class="form-group">
                    <label for="hidden">Hidden</label>
                    <input type="checkbox" id="hidden" v-model="form.hidden" />
                </div>

                 <div class="form-group">
                    <label>ルール</label>
                    <div class="rule-section" id="rulesContainer">
                    <theme-rule-editor
                        v-for="(rule,index) in rules"
                        :key="index"
                        v-model="rules[index]"
                        :index="index"
                        @remove="removeRuleItem(index)">
                        </theme-rule-editor>
                    </div>
                    <button type="button" class="add-rule-btn" @click="addRuleItem">ルールを追加</button>
                </div>

                <div class="info-row">
                    <span><strong>Created</strong></span>
                    <span th:text="${theme.createdAt}">createdAt</span>
                </div>
                <div class="info-row">
                    <span><strong>Updated</strong></span>
                    <span th:text="${theme.updatedAt}">updatedAt</span>
                </div>
                <div class="actions">
                    <button type="submit" id="submitBtn">保存</button>
                    <button type="button" id="deleteBtn" @click="submitDelete">削除</button>
                    <a href="javascript:history.back()">戻る</a>
                 </div> 
            </form>
           
        </div>
    </div>
</div>
<script type="module" src="/static/js/admin/adminthemeedit.js" th:src="@{/js/admin/adminthemeedit.js}"></script>
</body>
</html>
