<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">
  
  <title>トイタビ – 単独スポット問題</title>
  <meta name="description" content="街の隠れた名所へ出かけるお散歩クイズサイト、トイタビ。
  お散歩、解答してキャラクターをゲットしよう!"
  th:content="${pageDescription} ?: '説明なし'">
  <!--全ページ共通のCSS-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <!--ローディング画面用CSS-->
  <link rel="stylesheet" href="../../static/css/loading.css" th:href="@{/css/loading.css}">

  <!--LeafletのCDNに 事前接続 して読み込みを高速化-->
  <link rel="preconnect" href="https://unpkg.com" />
  <!--プレイ中（問題画面）専用のCSS-->
  <link rel="stylesheet" href="../../static/css/game/question.css" th:href="@{/css/game/question.css}">
  <!-- Leaflet CSS / JS（CDN）, 地図表示用CSS-->
  <link  rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!--LeafletのJavaScript本体-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- LeafletLocate CSS / JS（CDN）, 現在地ボタンのCSS-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.css">
  <!--現在地取得用JS-->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.js"></script>
  
  <script src="https://unpkg.com/leaflet-semicircle"></script>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<!--ページ本体開始 背景色をCSS変数 --ink に設定-->
<body style="background-color:var(--ink);">
  <!--画面全体のレイアウト管理用-->
  <div class="screen">
    <!--Thymeleafの値をJS内で使えるようにする-->
    <!--サーバーから渡された response をJS変数に代入-->
    <script th:inline="javascript">
      let spot =/*[[${spot}]]*/
    </script> 

    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('トイスポットを探せ')}"></div>

    <!-- 中央スクロール領域 -->
    <main class="content" id="scrollArea">
      
      <photo-gallery :photos="spotPhotos"></photo-gallery>
      
      <spot-description-card 
      description="説明なし" th:descritpion="${spot.description}"
       author="問人知らず" th:author="${spot.author}" 
       :tags="spottags">
      </spot-description-card>

      <!-- 現在地マップ -->
      <section id="mapSection" class="map-wrap c-card">
        <!--Leafletが地図を描画するDOM-->
        <div id="map"></div>
        <!--注意書き-->
        <div class="map-caption">現在地を表示中（位置情報の許可が必要です）</div>
      </section>
      <section id="answer-user" class ="c-card">
        <span class="label">解答中のユーザー</span>
        <span class="username" sec:authorize="isAuthenticated()" th:text="${#authentication.principal.user.username}"></span>
        <!--未ログイン時-->
        <button class="user-info-btn capsule-btn" sec:authorize="isAnonymous()"onclick="location.href='/login'">
          <span class="username">ログイン</span>
        </button>
      </section>
    </main>

    <!--footer-->
    <!-- 固定フッター -->
    <footer class="app-footer">
      <div class="bottom-actions" style="grid-template-columns:1fr 2fr;">
        <div class ="footer-button-container">
          <button class="action-btn home-btn c-card" type="button" onclick="location.href='/spotpost/capture'"> 
            <div class ="caption">スポットの投稿</div>
            <img class = "icon-img" src = "../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
          </button>
        </div>
        <div class ="footer-button-container">
          <button class="action-btn next-btn  c-card" type="button" onclick="location.href='/'">
            <div class="caption">ホームへ戻る</div>
            <img class = "icon-img" src = "../../static/asset/images/icon/icon_home.png" th:src="@{/asset/images/icon/icon_home.png}"/>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loadingOverlay">
    <!--回転アニメーション-->
    <div class="spinner"></div>
  </div>

  <!-- Question制御用スクリプト -->
  <script type="module" src="../../static/js/index/spot.js" th:src="@{/js/index/spot.js}"></script>
</body>
</html>
