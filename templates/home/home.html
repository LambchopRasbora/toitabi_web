<!doctype html>
<html lang="ja" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title>トイタビ – エリア選択</title>
  <!--CSSファイルを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="../../static/css/home.css" th:href="@{/css/home.css}">

  <!--Leaflet（地図表示ライブラリ）の CSS をCDNから読み込み-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!--Leafletの JavaScript本体-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- LeafletLocate CSS / JS（CDN）, 現在地ボタンのCSS-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.css">
  <!--現在地取得用JS-->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.85.1/dist/L.Control.Locate.min.js"></script>

  <!--jscookieのライブラリを読み込む-->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  
</head>


<body>
  <!--Thymeleaf の値を JavaScript内で使えるようにして、Thymeleaf の値を JavaScript内で使えるようにする-->
  <script th:inline ="javascript">
    const data =/*[[${data}]]*/{}
  </script>

  <!--CSSレイアウト制御用の画面全体を囲うコンテナ-->
  <div class="screen">
    <!-- Header-->
    <div th:replace="~{common/layout :: header-nav('トイタビに出かけよう!<br>ホーム画面')}"></div>

    <!-- Main Content -->
    <main class ="content">
      <!--エリア選択UI用の領域-->
      <div class="buttonareas">
        <!--continueボタン-->
        <button id="continue-btn" class="continue-btn area-card">
          <!--アイコンを丸く囲う-->
          <img class="icon-circle" src="../../static/asset/images/icon/totyuicon.png" th:src="@{/asset/images/icon/totyuicon.png}"/>

          <div class="label-container">
            <span class="label">途中から</span>
          </div>
        </button>
        <!--ここにエリアやゾーンが入る-->
        <!--エリアカードのテンプレート-->
        <template id="area-card-template">
          <div class="area-card-caontainer">
            <button class="area-card">
              <!--アイコンを丸く囲う-->
              <img class="icon-circle" src="../../static/asset/images/icon/totyuicon.png" th:src="@{/asset/images/icon/totyuicon.png}"/>

              <div class="label-container">
                <span class="label">途中から</span>
              </div>
            </button>
            <div class="theme-list">
              <!--テーマカードが入る-->
            </div>
          </div>
        </template>

        <!--テーマのテンプレート-->
        <template id="theme-card-template">
          <button class="theme-card">
            <!--ボタンの文字-->
            <span class="theme-label">途中から</span>
          </button>
        </template>
      </div>
    </main>
    
    <!-- Footer -->
    <footer class="app-footer">
      <!-- Bottom actions -->
      <div class="bottom-actions">
        <!--設定画面へ遷移するボタン-->
        <button class="action-btn menu-btn" type="button">
          <!--ボタンのラベル-->
          <div class ="caption">メニュー</div>
          <!--メニューアイコン-->
          <img class = "icon-img" src = "../../static/asset/images/menulogo.png" th:src="@{asset/images/menulogo.png}"/>
        </button>

        <!--投稿画面へ遷移-->
        <button class="action-btn" type="button" onclick= "location.href='/spotpost/capture'" >
          <!--ボタンのラベル-->
          <div class="caption">トイスポットを投稿</div>
          <!--投稿用アイコン-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
        </button>
      </div> 
    </footer>
    <!-- homeの制御スクリプト -->
    <script type ="module" src="../../static/js/pages/home.js" th:src="@{/js/pages/home.js}"></script>
  </div>
</body>
</html>
