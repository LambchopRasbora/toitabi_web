<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title>トイタビ – キャラクター一覧</title>
  <!--CSSファイルを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="../../static/css/me/characterindex.css" th:href="@{/css/me/characterindex.css}">
</head>

<body>
  <div class="screen">
  <!--Thymeleaf の値を JavaScript内で使えるようにして、Thymeleaf の値を JavaScript内で使えるようにする-->
  <script th:inline ="javascript">
    const charas =/*[[${charas}]]*/{}
  </script>
  
  <script type="module" src="../../static/js/me/characterindex.js" th:src="@{/js/me/characterindex.js}"></script>
  <!--Header-->
  <div th:replace="~{common/layout :: header-nav('手に入れたキャラクター')}"></div>
  <!-- Main Content -->
  <main class ="content">
    <!--レイアウト用のラッパー-->
    <div class="container">
      <h2 class="section-title">キャラクター一覧</h2>
      <div class = "character-container">
        <!--キャラクターのカードを繰り返し表示-->
        <button class="character-card" data-charaId="${character.charaId}"  th:each="character : ${charas}">
          <img class="character-image" th:src="@{${character.lowImageUri}}" alt="キャラクター画像">
          <h3 class="character-name" th:text="${character.name}">キャラクター名</h3>
        </button>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <footer class="app-footer">
    <!-- Bottom actions -->
    <div class="bottom-actions">
      <!--投稿画面へ遷移-->
      <button class="action-btn" type="button" onclick= "location.href='/'" >
        <!--ボタンのラベル-->
        <div class="caption">ホームへ戻る</div>
        <!--ホームアイコン-->
        <img class = "icon-img" src = "../../static/asset/images/icon/homeicon.png" th:src="@{/asset/images/icon/homeicon.png}"/>
      </button>
    </div> 
  </footer>
  <div id ="character-detail" class ="hidden">
    <div class="detail-container">
      <h2 class="detail-title">キャラクターの名前</h2>
      <img class="detail-image" src="../../static/asset/images/default/NoImage.jpg" th:src="@{/asset/images/default/NoImage.jpg}" alt="キャラクター画像">
      <p class="detail-description">キャラクターの説明文がここに入ります。キャラクターの特徴や背景などを詳しく説明します。</p>
      <button class="detail-close-btn">閉じる</button>
    </div>

  </div>  
  </div>
</body>
</html>
