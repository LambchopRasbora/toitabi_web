<!doctype html>
<html lang="ja" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title>マイページ</title>
  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">
  <!--CSSファイルを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">

  <script type ="module" src="../../static/js/me/mypage.js" th:src="@{/js/me/mypage.js}"></script>
</head>
<body>
  <script th:inline="javascript">
    const user =/*[[${user}]]*/{};
  </script>
  <!--CSSレイアウト制御用の画面全体を囲うコンテナ-->
  <div class="screen">
    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('マイページ')}"></div>

    <!-- Main Content -->
    <main class ="content">
      <h1>マイページ</h1>
      <h3>ユーザ名</h3> <p  id="username-field">ここにアカウント名を表示</p>
      <h3>メールアドレス</h3> <p id="email-field">ここにメールアドレスを表示</p>
      <h3>獲得点数</h3><p id="point-field">獲得した点数(現在工事中)</p>
      <ul>
        <li><button class = "menu-content-btn" onclick="location.href='/me/characterindex'">
        <img class src ="../../static/asset/images/icon/icon_library.png" th:src="@{/asset/images/icon/icon_library.png}"/>
        <p>My図鑑</p>
        </button></li>
      <li><button class = "menu-content-btn" onclick="location.href='/me/characterindex'">
        <img class src ="../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
        <p>投稿したトイスポット</p>
      </button></li>
      </ul>
      <form action="/logout" th:action="@{/logout}" method="POST">
       <button href="/logout">ログアウト</button>
      </form>
    </main>
    
    <!-- Footer -->
    <footer class="app-footer">
      <!-- Bottom actions -->
      <div class="bottom-actions">
        <!--設定画面へ遷移するボタン-->
        <button class="action-btn menu-btn" type="button" onclick= "location.href='/'" >
          <!--ボタンのラベル-->
          <div class ="caption">ホームへ戻る</div>
          <!--メニューアイコン-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_home.png" th:src="@{/asset/images/icon/icon_home.png}"/>
        </button>

        <!--投稿画面へ遷移-->
        <button class="action-btn" type="button" onclick= "location.href='/spotpost/capture'" >
          <!--ボタンのラベル-->
          <div class="caption">トイスポットを投稿</div>
          <!--投稿用アイコン-->
          <img class = "icon-img" src = "../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
        </button>
      </div> 
    </footer>
</body>
</html>
