<!doctype html>
<html lang="ja" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title>マイページ</title>
  <link rel ="icon" href="../../static/asset/favicon.ico" th:href="@{/asset/favicon.ico}">
  <!--CSSファイルを読み込む-->
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="../../static/css/me/mypage.css" th:href="@{/css/me/mypage.css}">

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script type ="module" src="../../static/js/me/mypage.js" th:src="@{/js/me/mypage.js}"></script>
</head>
<body>
  <script th:inline="javascript">
    const user =/*[[${user}]]*/{};
  </script>
  <!--CSSレイアウト制御用の画面全体を囲うコンテナ-->
  <div class="screen">
    <!-- Header -->
    <div th:replace="~{common/layout :: header-nav('マイページ')}"></div>

    <!-- Main Content -->
    <main class ="content">
      <h1>マイページ</h1>
      <div class="c-card">
      <h3>ユーザ名</h3> <p  id="username-field">ここにアカウント名を表示</p>
      <h3>メールアドレス</h3> <p id="email-field">ここにメールアドレスを表示</p>
      <h3>獲得点数</h3><p id="point-field" th:text="${point}">獲得した点数(現在工事中)</p>
      </div>
      <ul>
        <li><button class = "menu-content-btn" onclick="location.href='/me/characterindex'">
        <img class src ="../../static/asset/images/icon/icon_library.png" th:src="@{/asset/images/icon/icon_library.png}"/>
        <p>My図鑑</p>
        </button></li>
      <li><button class = "menu-content-btn" onclick="location.href='/me/spotindex'">
        <img class src ="../../static/asset/images/icon/icon_post.png" th:src="@{/asset/images/icon/icon_post.png}"/>
        <p>投稿したトイスポット</p>
      </button></li>
      </ul>
      <form action="/logout" th:action="@{/logout}" method="POST">
       <button class="capsule-btn" href="/logout">ログアウト</button>
      </form>
    </main>
    
    <!-- Footer -->
    <div id="footer">
      <toitabi-footer :ratio="'1fr 1fr'"
        :leftcontents="leftContents"
        :rightcontents="rightContents">
      </toitabi-footer> 
    </div>
</body>
</html>
