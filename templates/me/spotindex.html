    <h1>投稿したスポット一覧</h1>
    <div class ="map-container c-card">

    <div  id="spot-detail-container"  class ="c-card">

        type="text" 
        v-model="searchQuery" 
        placeholder="説明文やタグで検索..." 
        style="width: 100%; padding: 0.5rem; box-sizing: border-box;"
      />
    </div>
      <div v-for="spot in filterdSpots" :key="spot.spotId">
        <button class="spot-btn" @click="putSpotButton(spot.spotId)">
        <spot-review-card
          :description="spot.description||'説明なし'"
          :author="spot.author||'問人知らず'"
          :tags="spot.tags||'[]'"
          :image="spot.images[0]||'/asset/images/default/NoImage.jpg'"
        >
        </spot-review-card>
      </button>
      </div>
    </div>
  </main>
